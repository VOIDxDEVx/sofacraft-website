<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gallery | SOFACRAFT</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>


    <main>

        <!-- PAGE HERO -->

        <section class="page-hero gallery-page-hero">

            <div class="container page-hero-content">

                <span class="section-number"></span>

                <p class="section-label">
                    OUR WORK
                </p>

                <h1>
                    See What
                    <span>We've Made.</span>
                </h1>

                <p>
                    Explore sofas, dining furniture and
                    custom pieces created for our customers.
                </p>

            </div>

        </section>


        <!-- GALLERY -->

        <section class="full-gallery-section">

            <div class="container">

                <div class="gallery-filter">

                    <button
                        class="gallery-filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="gallery-filter-btn"
                        data-filter="sofa"
                    >
                        Sofas
                    </button>

                    <button
                        class="gallery-filter-btn"
                        data-filter="dining"
                    >
                        Dining
                    </button>

                </div>


                <div class="full-gallery-grid">


                    <!-- IMAGE 01 -->

                    <article
                        class="full-gallery-item gallery-large"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-01.jpeg"
                            alt="Sofa 01"
                        >

                    </article>


                    <!-- IMAGE 02 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-02.jpeg"
                            alt="Sofa 02"
                        >

                    </article>


                    <!-- IMAGE 03 -->

                    <article
                        class="full-gallery-item"
                        data-category="dining"
                    >

                        <img
                            src="../assets/images/gallery/gallery-12.jpeg"
                            alt="Dining Furniture 01"
                        >

                    </article>


                    <!-- IMAGE 04 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-04.jpeg"
                            alt="Sofa 03"
                        >

                    </article>


                    <!-- IMAGE 05 -->

                    <article
                        class="full-gallery-item"
                        data-category="dining"
                    >

                        <img
                            src="../assets/images/gallery/gallery-0.jpeg"
                            alt="Dining Furniture 02"
                        >

                    </article>


                    <!-- IMAGE 06 -->

                    <article
                        class="full-gallery-item gallery-large"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-06.jpeg"
                            alt="Sofa 04"
                        >

                    </article>


                    <!-- IMAGE 07 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-07.jpeg"
                            alt="Sofa 05"
                        >

                    </article>


                    <!-- IMAGE 08 -->

                    <article
                        class="full-gallery-item"
                        data-category="dining"
                    >

                        <img
                            src="../assets/images/gallery/gallery-0.jpeg"
                            alt="Dining Furniture 03"
                        >

                    </article>


                    <!-- IMAGE 09 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-09.jpeg"
                            alt="Sofa 06"
                        >

                    </article>


                    <!-- IMAGE 10 -->

                    <article
                        class="full-gallery-item"
                        data-category="dining"
                    >

                        <img
                            src="../assets/images/gallery/gallery-0.jpeg"
                            alt="Dining Furniture 04"
                        >

                    </article>


                    <!-- IMAGE 11 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-11.jpeg"
                            alt="Sofa 07"
                        >

                    </article>


                    <!-- IMAGE 12 -->

                    <article
                        class="full-gallery-item"
                        data-category="sofa"
                    >

                        <img
                            src="../assets/images/gallery/gallery-03.jpeg"
                            alt="Sofa 08"
                        >

                    </article>


                </div>

            </div>

        </section>


        <!-- CTA -->

        <section class="gallery-cta">

            <div class="container">

                <p class="section-label">
                    LIKE WHAT YOU SEE?
                </p>

                <h2>
                    Let's build
                    <span>yours next.</span>
                </h2>

                <a
                    href="contact.html"
                    class="btn btn-primary"
                >
                    Start Your Order
                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <div id="footer"></div>


    <!-- WHATSAPP -->

    <div id="whatsapp"></div>


    <!-- JAVASCRIPT -->

    <script src="../js/main.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/gallery.js"></script>

</body>

</html>
